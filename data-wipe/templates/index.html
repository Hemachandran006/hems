<!DOCTYPE html>
<html>
<head>
    <title>Data Wipe Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Data Wipe Tool</h1>
        
        <div class="step" id="step1">
            <h2>Step 1: Detect Devices</h2>
            <button onclick="detectDevices()">Detect Devices</button>
            <select id="deviceSelect" style="display: none;"></select>
        </div>

        <div class="step" id="step2" style="display: none;">
            <h2>Step 2: Select Wipe Method</h2>
            <select id="methodSelect">
                <option value="NIST 800-88">NIST 800-88 (1 pass overwrite)</option>
                <option value="DoD 5220.22-M">DoD 5220.22-M (3 pass overwrite)</option>
            </select>
            <button onclick="startWipe()">Start Wipe</button>
        </div>

        <div class="step" id="step3" style="display: none;">
            <h2>Step 3: Wiping in Progress</h2>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p id="status">Status: Initializing...</p>
        </div>

        <div class="step" id="step4" style="display: none;">
            <h2>Step 4: Verification</h2>
            <p id="verificationStatus"></p>
        </div>

        <div class="step" id="step5" style="display: none;">
            <h2>Step 5: Certificate</h2>
            <button onclick="downloadCertificate()">Download Certificate</button>
        </div>
    </div>

    <script>
        let wipeData = {};

        async function detectDevices() {
            const response = await fetch('/detect');
            const devices = await response.json();
            
            const select = document.getElementById('deviceSelect');
            select.innerHTML = devices.map(device => 
                `<option value="${device.id}">${device.name} (${device.size})</option>`
            ).join('');
            
            select.style.display = 'block';
            document.getElementById('step2').style.display = 'block';
        }

        async function startWipe() {
            const device = document.getElementById('deviceSelect').value;
            const method = document.getElementById('methodSelect').value;
            
            document.getElementById('step3').style.display = 'block';
            
            const response = await fetch('/wipe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ device, method })
            });
            
            const result = await response.json();
            wipeData = {
                device,
                method,
                status: result.status,
                hash_before: result.hash_before,
                hash_after: result.hash_after
            };
            
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('status').textContent = 'Status: Complete';
            
            verifyWipe();
        }

        async function verifyWipe() {
            document.getElementById('step4').style.display = 'block';
            
            const response = await fetch('/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(wipeData)
            });
            
            const result = await response.json();
            document.getElementById('verificationStatus').textContent = 
                `Verification ${result.status}`;
            
            document.getElementById('step5').style.display = 'block';
        }

        async function downloadCertificate() {
            const response = await fetch('/certificate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(wipeData)
            });
            
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'wipe_certificate.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
